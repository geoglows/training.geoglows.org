<text x="999.6" y="360.7" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4a5568" >measures air drag and other non-</text>
<text x="999.6" y="375.7" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4a5568" >gravitational forces, to be removed</text>
<text x="600.0" y="540.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2b6cb0" >Earth</text>
