<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670">
<title>GRACE Regional Analyst processing chain</title>
<defs>
<marker id="ah-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker>
<marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker>
<marker id="ah-lightblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bee3f8"/></marker>
<marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c7a7b"/></marker>
<marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dd6b20"/></marker>
<marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker>
<marker id="ah-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#718096"/></marker>
<marker id="ah-darkgray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
<marker id="ah-lightgray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker>
<marker id="ah-ground" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6dcc6"/></marker>
<marker id="ah-groundline" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a89474"/></marker>
<marker id="ah-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d69e2e"/></marker>
<marker id="ah-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f7fafc"/></marker>
<marker id="ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#68a063"/></marker>
</defs>
<rect width="1200" height="670" fill="white"/>
<text x="25.0" y="42.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="#1f3a5f" >From satellite and model data to groundwater storage anomalies</text>
<text x="25.0" y="86.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start" fill="#718096" >INPUTS (monthly)</text>
<rect x="25" y="100" width="270" height="160" rx="8" fill="white" stroke="#1f3a5f" stroke-width="1.8"/>
<rect x="25" y="100" width="270" height="36" rx="8" fill="#1f3a5f"/>
<rect x="25" y="126" width="270" height="10" fill="#1f3a5f"/>
<text x="160.0" y="125.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle" fill="white" >GRACE / GRACE-FO</text>
<text x="39.0" y="164.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >JPL mascon RL06.3 (CRI)</text>
<text x="39.0" y="189.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >TWS anomaly + σ</text>
<text x="39.0" y="214.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >0.5° grid (3° mascons)</text>
<text x="39.0" y="239.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >Relative to 2004–2009</text>
<rect x="25" y="285" width="270" height="235" rx="8" fill="white" stroke="#2c7a7b" stroke-width="1.8"/>
<rect x="25" y="285" width="270" height="36" rx="8" fill="#2c7a7b"/>
<rect x="25" y="311" width="270" height="10" fill="#2c7a7b"/>
<text x="160.0" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle" fill="white" >GLDAS 2.1 models</text>
<text x="39.0" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >Noah (0.25°)</text>
<text x="39.0" y="374.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >VIC (1°)</text>
<text x="39.0" y="399.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >CLSM (1°)</text>
<text x="39.0" y="424.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >Snow water equivalent,</text>
<text x="39.0" y="449.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >canopy water, soil</text>
<text x="39.0" y="474.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >moisture (all layers, ~2 m)</text>
<text x="335.0" y="86.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start" fill="#718096" >STEP 1</text>
<rect x="335" y="285" width="240" height="235" rx="8" fill="white" stroke="#2c7a7b" stroke-width="1.8"/>
<rect x="335" y="285" width="240" height="36" rx="8" fill="#2c7a7b"/>
<rect x="335" y="311" width="240" height="10" fill="#2c7a7b"/>
<text x="455.0" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle" fill="white" >Anomalies</text>
<text x="349.0" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >Convert kg/m² to cm</text>
<text x="349.0" y="374.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >of water</text>
<text x="349.0" y="399.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >Regrid all models to 1°</text>
<text x="349.0" y="424.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >Subtract each cell's</text>
<text x="349.0" y="449.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >2004–2009 mean, so</text>
<text x="349.0" y="474.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >GLDAS anomalies share</text>
<text x="349.0" y="499.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >GRACE's baseline</text>
<text x="615.0" y="86.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start" fill="#718096" >STEP 2</text>
<rect x="615" y="285" width="250" height="235" rx="8" fill="white" stroke="#2c7a7b" stroke-width="1.8"/>
<rect x="615" y="285" width="250" height="36" rx="8" fill="#2c7a7b"/>
<rect x="615" y="311" width="250" height="10" fill="#2c7a7b"/>
<text x="740.0" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle" fill="white" >Model ensemble</text>
<text x="629.0" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >SWEa, CANa, SMa =</text>
<text x="629.0" y="374.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >mean of the three</text>
<text x="629.0" y="399.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >models</text>
<text x="629.0" y="424.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >Uncertainty of each =</text>
<text x="629.0" y="449.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >standard deviation</text>
<text x="629.0" y="474.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >across the three models</text>
<text x="905.0" y="86.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start" fill="#718096" >STEP 3</text>
<rect x="905" y="100" width="270" height="420" rx="8" fill="white" stroke="#dd6b20" stroke-width="1.8"/>
<rect x="905" y="100" width="270" height="36" rx="8" fill="#dd6b20"/>
<rect x="905" y="126" width="270" height="10" fill="#dd6b20"/>
<text x="1040.0" y="125.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle" fill="white" >Water balance (1°)</text>
<text x="919.0" y="164.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >TWSa averaged to 1°</text>
<text x="919.0" y="189.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" ></text>
<text x="919.0" y="214.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >GWSa = TWSa − (SWEa</text>
<text x="981.0" y="239.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >+ CANa + SMa)</text>
<text x="919.0" y="264.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" ></text>
<text x="919.0" y="289.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >σGWSa = √(σ²TWSa</text>
<text x="981.0" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >+ σ²SWEa + σ²CANa</text>
<text x="981.0" y="339.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >+ σ²SMa)</text>
<text x="919.0" y="364.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" ></text>
<text x="919.0" y="389.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >Errors treated as</text>
<text x="919.0" y="414.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >independent</text>
<line x1="295.0" y1="402.5" x2="332.0" y2="402.5" stroke="#718096" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#ah-gray)"/>
<line x1="575.0" y1="402.5" x2="612.0" y2="402.5" stroke="#718096" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#ah-gray)"/>
<line x1="865.0" y1="402.5" x2="902.0" y2="402.5" stroke="#718096" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#ah-gray)"/>
<line x1="295.0" y1="180.0" x2="902.0" y2="180.0" stroke="#718096" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#ah-gray)"/>
<rect x="25" y="555" width="1150" height="90" rx="8" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="45.0" y="591.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#1f3a5f" >In the app</text>
<text x="45.0" y="619.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >Five layers, each ±1σ:</text>
<text x="255.0" y="591.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >GWSa, SMa, SWEa, CANa on the 1° grid</text>
<text x="255.0" y="619.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >TWSa on the 0.5° grid, as JPL distributes it</text>
<text x="680.0" y="591.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >Monthly, April 2002 to the latest GRACE-FO release</text>
<text x="680.0" y="619.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4a5568" >Units: cm of liquid water equivalent</text>
</svg>
