<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<title>GRACE Regional Analyst processing chain</title>
<defs>
<marker id="ah-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker>
<marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker>
<marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c7a7b"/></marker>
<marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dd6b20"/></marker>
<marker id="ah-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#718096"/></marker>
<marker id="ah-darkgray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
<marker id="ah-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d69e2e"/></marker>
<marker id="ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#68a063"/></marker>
</defs>
<rect width="1200" height="700" fill="white"/>
<text x="25" y="42" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#1f3a5f">From satellite and model data to groundwater storage anomalies</text>
<text x="25" y="68" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#718096">The GRACE + GLDAS 2.1 route. GLDAS 2.2 reaches groundwater without any of this; see the page text.</text>
<text x="25" y="112" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#718096">INPUTS (monthly)</text>
<text x="320" y="112" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#718096">STEP 1</text>
<text x="615" y="112" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#718096">STEP 2</text>
<text x="910" y="112" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#718096">STEP 3</text>
<rect x="25" y="126" width="265" height="190" rx="8" fill="white" stroke="#1f3a5f" stroke-width="1.8"/>
<rect x="25" y="126" width="265" height="36" rx="8" fill="#1f3a5f"/>
<rect x="25" y="152" width="265" height="10" fill="#1f3a5f"/>
<text x="157.5" y="151" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">GRACE / GRACE-FO</text>
<text x="39" y="190" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">JPL mascon RL06.3 (CRI)</text>
<text x="39" y="214" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">TWS anomaly + σ</text>
<text x="39" y="238" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">0.5° grid (3° mascons)</text>
<text x="39" y="262" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">Relative to 2004–2009</text>
<rect x="320" y="126" width="265" height="190" rx="8" fill="white" stroke="#d69e2e" stroke-width="1.8"/>
<rect x="320" y="126" width="265" height="36" rx="8" fill="#d69e2e"/>
<rect x="320" y="152" width="265" height="10" fill="#d69e2e"/>
<text x="452.5" y="151" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Gain factors</text>
<text x="334" y="190" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">Multiply TWSa and its σ</text>
<text x="334" y="214" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">by JPL's factor for the cell,</text>
<text x="334" y="238" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">at 0.5°, before averaging</text>
<text x="334" y="262" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">Factors outside (0, 3] are</text>
<text x="334" y="286" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">left unapplied</text>
<rect x="25" y="346" width="265" height="230" rx="8" fill="white" stroke="#2c7a7b" stroke-width="1.8"/>
<rect x="25" y="346" width="265" height="36" rx="8" fill="#2c7a7b"/>
<rect x="25" y="372" width="265" height="10" fill="#2c7a7b"/>
<text x="157.5" y="371" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">GLDAS 2.1 models</text>
<text x="39" y="410" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">Noah (0.25°)</text>
<text x="39" y="434" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">VIC (1°)</text>
<text x="39" y="458" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">CLSM (1°)</text>
<text x="39" y="482" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">Snow water equivalent,</text>
<text x="39" y="506" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">canopy water, soil</text>
<text x="39" y="530" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">moisture (all layers)</text>
<rect x="320" y="346" width="265" height="230" rx="8" fill="white" stroke="#2c7a7b" stroke-width="1.8"/>
<rect x="320" y="346" width="265" height="36" rx="8" fill="#2c7a7b"/>
<rect x="320" y="372" width="265" height="10" fill="#2c7a7b"/>
<text x="452.5" y="371" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Anomalies</text>
<text x="334" y="410" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">Convert kg/m² to cm</text>
<text x="334" y="434" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">Regrid all models to 1°</text>
<text x="334" y="458" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">Subtract each cell's</text>
<text x="334" y="482" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">2004–2009 mean, so GLDAS</text>
<text x="334" y="506" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">shares GRACE's baseline</text>
<rect x="615" y="346" width="265" height="230" rx="8" fill="white" stroke="#2c7a7b" stroke-width="1.8"/>
<rect x="615" y="346" width="265" height="36" rx="8" fill="#2c7a7b"/>
<rect x="615" y="372" width="265" height="10" fill="#2c7a7b"/>
<text x="747.5" y="371" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Model ensemble</text>
<text x="629" y="410" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">SWEa, CANa, SMa =</text>
<text x="629" y="434" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">mean of the three models</text>
<text x="629" y="458" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">Uncertainty of each =</text>
<text x="629" y="482" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">standard deviation</text>
<text x="629" y="506" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">across the three</text>
<rect x="910" y="126" width="265" height="450" rx="8" fill="white" stroke="#dd6b20" stroke-width="1.8"/>
<rect x="910" y="126" width="265" height="36" rx="8" fill="#dd6b20"/>
<rect x="910" y="152" width="265" height="10" fill="#dd6b20"/>
<text x="1042.5" y="151" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Water balance (1°)</text>
<text x="924" y="190" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">Scaled TWSa averaged to 1°</text>
<text x="924" y="214" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568"></text>
<text x="924" y="238" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">GWSa = TWSa − (SWEa</text>
<text x="924" y="262" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">        + CANa + SMa)</text>
<text x="924" y="286" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568"></text>
<text x="924" y="310" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">σGWSa = √(σ²TWSa</text>
<text x="924" y="334" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">        + σ²SWEa + σ²CANa</text>
<text x="924" y="358" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">        + σ²SMa)</text>
<text x="924" y="382" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568"></text>
<text x="924" y="406" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">Errors treated as</text>
<text x="924" y="430" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">independent</text>
<line x1="290" y1="221" x2="317" y2="221" stroke="#718096" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah-gray)"/>
<line x1="585" y1="170" x2="907" y2="170" stroke="#718096" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah-gray)"/>
<line x1="290" y1="461" x2="317" y2="461" stroke="#718096" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah-gray)"/>
<line x1="585" y1="461" x2="612" y2="461" stroke="#718096" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah-gray)"/>
<line x1="880" y1="461" x2="907" y2="461" stroke="#718096" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah-gray)"/>
<rect x="25" y="606" width="1150" height="80" rx="8" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="45" y="640" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#1f3a5f">In the app</text>
<text x="45" y="668" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">Five layers, each ±1σ:</text>
<text x="255" y="640" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">GWSa, SMa, SWEa, CANa on the 1° grid</text>
<text x="255" y="668" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">TWSa on the 0.5° grid, with the gain factors applied</text>
<text x="700" y="640" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">Monthly, April 2002 to the latest GRACE-FO release</text>
<text x="700" y="668" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#4a5568">Units: cm of liquid water equivalent</text>
</svg>
