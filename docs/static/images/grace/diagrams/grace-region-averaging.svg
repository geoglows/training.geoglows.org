<text x="558.0" y="270.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#1f3a5f" >measured on the ellipsoid:</text>
<rect x="558" y="286" width="300" height="60" rx="8" fill="#f7fafc" stroke="#2b6cb0"/>
<text x="708" y="323" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#1f3a5f">x̄ = Σ aᵢ xᵢ  /  Σ aᵢ</text>
<text x="558.0" y="376.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#718096" >The ±1σ band is averaged the same way, which treats the</text>
<text x="558.0" y="394.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#718096" >errors in neighbouring cells as fully correlated.</text>
