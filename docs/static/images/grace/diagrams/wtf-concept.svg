<text x="0" y="0" transform="translate(34,235.0) rotate(-90)" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#4a5568">GWSa (cm)</text>
<text x="420.0" y="454.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4a5568" >time (months)</text>
