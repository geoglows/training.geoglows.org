<text x="115.8" y="88.9" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#718096">S<tspan font-size='11' baseline-shift='sub'>A</tspan></text>
<circle cx="402.1" cy="254.9" r="6" fill="white" stroke="#2b6cb0" stroke-width="2.5"/>
<text x="402.1" y="280.9" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2b6cb0">S<tspan font-size='11' baseline-shift='sub'>B</tspan></text>
<circle cx="545.3" cy="76.4" r="6" fill="white" stroke="#2b6cb0" stroke-width="2.5"/>
<text x="545.3" y="62.4" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2b6cb0">S<tspan font-size='11' baseline-shift='sub'>P</tspan></text>
<circle cx="545.3" cy="330.9" r="6" fill="white" stroke="#c53030" stroke-width="2.5"/>
<text x="525.3" y="336.9" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#c53030">S<tspan font-size='11' baseline-shift='sub'>L</tspan></text>
<line x1="585.3" y1="76.4" x2="585.3" y2="254.9" stroke="#2b6cb0" stroke-width="2.2" stroke-linecap="round" opacity="1"/>
<line x1="578.3" y1="76.4" x2="592.3" y2="76.4" stroke="#2b6cb0" stroke-width="2.2" stroke-linecap="round" opacity="1"/>
<line x1="578.3" y1="254.9" x2="592.3" y2="254.9" stroke="#2b6cb0" stroke-width="2.2" stroke-linecap="round" opacity="1"/>
<text x="599.2631578947369" y="170.7" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b6cb0">R<tspan font-size='11' baseline-shift='sub'>S</tspan></text>
<line x1="585.3" y1="254.9" x2="585.3" y2="330.9" stroke="#c53030" stroke-width="2.2" stroke-linecap="round" opacity="1"/>
<line x1="578.3" y1="254.9" x2="592.3" y2="254.9" stroke="#c53030" stroke-width="2.2" stroke-linecap="round" opacity="1"/>
<line x1="578.3" y1="330.9" x2="592.3" y2="330.9" stroke="#c53030" stroke-width="2.2" stroke-linecap="round" opacity="1"/>
<text x="599.2631578947369" y="297.9" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c53030">R<tspan font-size='11' baseline-shift='sub'>D</tspan></text>
<text x="115.8" y="438.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#718096" >previous peak</text>
<text x="545.3" y="438.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#718096" >this year's peak</text>
<text x="820" y="70" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f3a5f">Picks for one water year</text>
<text x="820" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4a5568">S<tspan font-size='10' baseline-shift='sub'>A</tspan>  previous wet-season peak</text>
<text x="820" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4a5568">S<tspan font-size='10' baseline-shift='sub'>B</tspan>  lowest point before the rise</text>
<text x="820" y="142" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4a5568">S<tspan font-size='10' baseline-shift='sub'>P</tspan>  this wet season's peak</text>
<text x="820" y="164" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4a5568">S<tspan font-size='10' baseline-shift='sub'>L</tspan>  where storage would have been</text>
<text x="820" y="182" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4a5568">      at the peak with no recharge</text>
<text x="820" y="226" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f3a5f">Recharge</text>
<text x="820" y="256" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#2b6cb0">R<tspan font-size='10' baseline-shift='sub'>S</tspan> = S<tspan font-size='10' baseline-shift='sub'>P</tspan> − S<tspan font-size='10' baseline-shift='sub'>B</tspan>   (visible rise)</text>
<text x="820" y="282" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#c53030">R<tspan font-size='10' baseline-shift='sub'>D</tspan> = S<tspan font-size='10' baseline-shift='sub'>B</tspan> − S<tspan font-size='10' baseline-shift='sub'>L</tspan>   (drainage offset)</text>
<rect x="810" y="304" width="340" height="80" rx="8" fill="#f7fafc" stroke="#2b6cb0"/>
<text x="820" y="334" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f3a5f">Method 1:  R = R<tspan font-size='10' baseline-shift='sub'>S</tspan></text>
<text x="820" y="366" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f3a5f">Method 2:  R = R<tspan font-size='10' baseline-shift='sub'>S</tspan> + R<tspan font-size='10' baseline-shift='sub'>D</tspan> = S<tspan font-size='10' baseline-shift='sub'>P</tspan> − S<tspan font-size='10' baseline-shift='sub'>L</tspan></text>
<text x="820" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#718096">GWSa is already a depth of water, so no</text>
<text x="820" y="430" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#718096">specific yield is needed: R is in cm per year.</text>
</svg>
