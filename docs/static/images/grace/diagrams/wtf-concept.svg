<polyline points="115.8,102.9 124.7,106.2 133.7,109.6 142.6,113.2 151.6,117.1 160.5,121.4 169.5,126.0 178.4,131.0 187.4,136.5 196.3,142.3 205.3,148.5 214.2,154.8 223.2,161.4 232.1,168.0 241.1,174.5 250.0,181.0 258.9,187.1 267.9,193.0 276.8,198.5 285.8,203.6 294.7,208.3 303.7,212.6 312.6,216.5 321.6,220.2 330.5,223.6 339.5,227.0 348.4,230.3 357.4,233.7 366.3,237.3 375.3,241.1 384.2,245.3 393.2,249.9 402.1,254.9 411.1,233.3 420.0,213.1 428.9,194.2 437.9,176.8 446.8,160.8 455.8,146.1 464.7,132.9 473.7,121.0 482.6,110.6 491.6,101.5 500.5,93.9 509.5,87.6 518.4,82.7 527.4,79.2 536.3,77.1 545.3,76.4 554.2,81.1 563.2,85.7 572.1,90.3 581.1,94.9 590.0,99.6 598.9,104.2 607.9,108.8 616.8,113.4 625.8,118.1 634.7,122.7 643.7,127.3 652.6,131.9 661.6,136.6 670.5,141.2 679.5,145.8 688.4,150.4" fill="none" stroke="#1f3a5f" stroke-width="3"/>
