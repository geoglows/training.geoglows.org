site_name: GEOGLOWS Training
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
  - macros
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: "Inicio"
            River Forecast System: "River Forecast System"
            Part 1 Model Formulation: "Parte 1: Formulación del Modelo"
            Model Formulation: "Formulación del Modelo"
            Part 2 Available Data: "Parte 2: Datos Disponibles"
            Data Catalog: "Catálogo de Datos"
            Hydrography: "Hidrografía"
            Retrospective Data: "Datos Retrospectivos"
            Forecast Data: "Datos Pronosticados"
            Part 3 Accessing Data: "Parte 3: Acceso a los Datos"
            Finding River Numbers: "Encontrar Números de Río"
            Querying Data: "Consultando Datos"
            Bulk Downloads: "Descargas Masivas"
            API (Data Service): "API (Servicio de Datos)"
            Web Maps: "Mapas Web"
            Part 4 Application Tutorials: "Parte 4: Tutoriales de Aplicación"
            Web App: "Aplicación Web"
            Notebooks: "Notebooks"
            Cookbook: "Recetario"
            Part 5 Bias Correction: "Parte 5: Corrección de Sesgo"
            SABER Method: "Método SABER"
            Correcting Forecasts: "Corregir Pronósticos"
            GRACE Regional Analyst: "GRACE Regional Analyst"
            Part 1 GRACE-Derived Storage Anomalies: "Parte 1: Anomalías de Almacenamiento Derivadas de GRACE"
            Overview: "Descripción General"
            Computational Algorithm: "Algoritmo de Cálculo"
            Available Data: "Datos Disponibles"
            Using the Web App: "Uso de la Aplicación Web"
            Part 4 Example Uses: "Parte 4: Ejemplos de Uso"
            Water Table Fluctuation Method: "Método de Fluctuación del Nivel Freático"
            Publications: "Publicaciones"
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: "Accueil"
            River Forecast System: "Système de Prévision Fluviale"
            Part 1 Model Formulation: "Partie 1 : Formulation du Modèle"
            Model Formulation: "Formulation du Modèle"
            Part 2 Available Data: "Partie 2 : Données Disponibles"
            Data Catalog: "Catalogue de Données"
            Hydrography: "Hydrographie"
            Retrospective Data: "Données Rétrospectives"
            Forecast Data: "Données Prévisionnelles"
            Part 3 Accessing Data: "Partie 3 : Accès aux Données"
            Finding River Numbers: "Trouver les Numéros de Rivière"
            Querying Data: "Interrogation des Données"
            Bulk Downloads: "Téléchargements en Masse"
            API (Data Service): "API (Service de Données)"
            Web Maps: "Cartes Web"
            Part 4 Application Tutorials: "Partie 4 : Tutoriels d'Application"
            Web App: "Application Web"
            Notebooks: "Cahiers"
            Cookbook: "Recueil de Recettes"
            Part 5 Bias Correction: "Partie 5 : Correction du Biais"
            SABER Method: "Méthode SABER"
            Correcting Forecasts: "Correction des Prévisions"
            GRACE Regional Analyst: "GRACE Regional Analyst"
            Part 1 GRACE-Derived Storage Anomalies: "Partie 1 : Anomalies de Stockage Dérivées de GRACE"
            Overview: "Vue d'Ensemble"
            Computational Algorithm: "Algorithme de Calcul"
            Available Data: "Données Disponibles"
            Using the Web App: "Utilisation de l'Application Web"
            Part 4 Example Uses: "Partie 4 : Exemples d'Utilisation"
            Water Table Fluctuation Method: "Méthode de Fluctuation de la Nappe Phréatique"
            Publications: "Publications"
theme:
  name: readthedocs
nav:
  - Home: index.md
  - River Forecast System:
      - Part 1 Model Formulation:
          - Model Formulation: rfs/model-formulation/model-formulation.md
      - Part 2 Available Data:
          - Data Catalog: rfs/datasets/catalog.md
          - Hydrography: rfs/datasets/hydrography.md
          - Retrospective Data: rfs/datasets/retrospective.md
          - Forecast Data: rfs/datasets/forecast.md
      - Part 3 Accessing Data:
          - Web App: rfs/accessing-data/web-app.md
          - Code Notebooks: rfs/accessing-data/exercises.md
          - Bulk Downloads: rfs/accessing-data/bulk-download.md
          - Cookbook: rfs/accessing-data/code-snippets.md
      - Part 4 Tutorials:
          - Finding River Numbers: rfs/tutorials/find-river-numbers.md
          - Querying Data: rfs/tutorials/query-data.md
          - API (Data Service): rfs/tutorials/data-service.md
          - Web Maps (GIS Layer): rfs/tutorials/web-map.md
      - Part 5 Bias Correction:
          - SABER Method: rfs/bias-correction/bias-correction.md
          - Correcting Forecasts: rfs/bias-correction/forecasted-bias-correction.md
  - GRACE Regional Analyst:
      - Part 1 GRACE-Derived Storage Anomalies:
          - Overview: grace/understanding/overview.md
          - Computational Algorithm: grace/understanding/computational-algorithm.md
      - Part 2 Available Data:
          - Available Data: grace/datasets/available-data.md
      - Part 3 Accessing Data:
          - Using the Web App: grace/accessing-data/web-app.md
      - Part 4 Example Uses:
          - Water Table Fluctuation Method: grace/applications/water-table-fluctuation.md
  - Publications: publications.md
  - Webinars:
      - "1. GEOGLOWS History and Introducing RFS Version 2": webinars/rfs-v2-webinar-1.md
      - "2. GEOGLOWS Model Formulation": webinars/rfs-v2-webinar-2.md
      - "3. GEOGLOWS Available Data": webinars/rfs-v2-webinar-3.md
      - "4. GEOGLOWS Hydroviewer 101": webinars/rfs-v2-webinar-4.md
