theme:
  name: readthedocs
  custom_dir: overrides
  logo: static/images/geoglows-logo.png
hooks:
  - hooks/i18n_root_templates.py
extra_css:
  - stylesheets/geoglows.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
nav:
  - Home: index.md
  - River Forecast System:
      - Part 1 Model Formulation:
          - Model Formulation: rfs/model-formulation/model-formulation.md
      - Part 2 Available Data:
          - Data Catalog: rfs/datasets/catalog.md
          - Hydrography: rfs/datasets/hydrography.md
          - Retrospective Data: rfs/datasets/retrospective.md
          - Forecast Data: rfs/datasets/forecast.md
      - Part 3 Accessing Data:
          - Web App: rfs/accessing-data/web-app.md
          - Code Notebooks: rfs/accessing-data/exercises.md
          - Bulk Downloads: rfs/accessing-data/bulk-download.md
          - Cookbook: rfs/accessing-data/code-snippets.md
      - Part 4 Tutorials:
          - Finding River Numbers: rfs/tutorials/find-river-numbers.md
          - Querying Data: rfs/tutorials/query-data.md
          - API (Data Service): rfs/tutorials/data-service.md
          - Web Maps (GIS Layer): rfs/tutorials/web-map.md
      - Part 5 Bias Correction:
          - SABER Method: rfs/bias-correction/bias-correction.md
          - Correcting Forecasts: rfs/bias-correction/forecasted-bias-correction.md
      - Publications: publications.md
  - GRACE Regional Analyst:
      - Part 1 Background:
          - Overview: grace/background/overview.md
          - The GRACE Mission: grace/background/grace-mission.md
          - Deriving Groundwater Storage: grace/background/deriving-groundwater.md
          - Resolution, Leakage and Small Regions: grace/background/resolution-and-leakage.md
      - Part 2 Using the App:
          - Interface: grace/app/interface.md
          - Regional View: grace/app/regional-view.md
          - Global View: grace/app/global-view.md
          - Trend Analysis: grace/app/trends.md
          - Gap Filling: grace/app/gap-filling.md
          - Downloading Data: grace/app/downloading-data.md
      - Part 3 Gap Filling: grace/gap-filling/method.md
      - Part 4 Recharge Analysis:
          - The WTF Method: grace/recharge/wtf-method.md
          - Opening the Analysis: grace/recharge/opening.md
          - Water Years and Picks: grace/recharge/picks.md
